name: Feature
description: Propose a scoped product or engineering capability.
title: "feat: "
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem, not only the proposed solution.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] Observable, testable result"
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Highest risk area
      options: [Routine, Safety, Security, Privacy, Accessibility, Intended use]
    validations:
      required: true
  - type: textarea
    id: exclusions
    attributes:
      label: Out of scope

