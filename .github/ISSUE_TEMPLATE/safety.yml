name: Safety concern
description: Report behaviour that may violate CareCompass safety boundaries.
title: "safety: "
labels: ["safety"]
body:
  - type: markdown
    attributes:
      value: Do not include identifiable health information. Use a synthetic example.
  - type: textarea
    id: concern
    attributes:
      label: Concern
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Potential user impact
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected safe behaviour
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Synthetic reproduction or evaluation evidence

