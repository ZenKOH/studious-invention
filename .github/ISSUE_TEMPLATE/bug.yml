name: Bug
description: Report reproducible incorrect behaviour using synthetic data.
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use synthetic information and remove all secrets.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [P0 - release blocking, P1 - urgent, P2 - normal, P3 - minor]
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment

